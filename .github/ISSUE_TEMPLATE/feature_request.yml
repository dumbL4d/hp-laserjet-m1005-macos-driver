name: Feature request
description: Suggest an improvement or a new supported workflow.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you file
      options:
        - label: I searched existing issues and this is not already requested.
          required: true
        - label: This does not require redistributing Apple/HP binaries.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or painful today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it behave? CLI flags, modes, docs, etc.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you tried.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - legacy-cups mode
        - native-ipp mode
        - Packaging / --patch-pkg-only
        - Documentation
        - Legal / licensing
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, upstream references, prior art.
